[project]
name = "owobook"
version = "0.1.0"
description = "WhatsApp voice-note bookkeeper for Lagos market traders, powered by Meta AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "tzdata>=2024.1",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owobook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
